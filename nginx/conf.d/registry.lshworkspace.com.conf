# Docker Registry upstream
upstream docker-registry {
    server 172.25.30.1:5000;
}

# HTTP 서버 (Cloudflare에서 오는 트래픽 처리)
server {
    listen 80;
    server_name registry.lshworkspace.com;
    server_tokens off;
    
    # Cloudflare에서 실제 클라이언트 IP 받기
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    
    # 대용량 이미지 업로드를 위한 설정
    client_max_body_size 0;
    chunked_transfer_encoding on;
    
    # Docker Registry API 경로 설정
    location /v2/ {
        # 오래된 Docker 클라이언트 차단
        if ($http_user_agent ~ "^(docker\/1\.(3|4|5(?!\.[0-9]-dev))|Go ).*$" ) {
            return 404;
        }
        
        # 프록시 설정
        proxy_pass http://docker-registry;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # Cloudflare가 HTTPS 처리
        proxy_set_header X-Forwarded-Port 443;
        
        # 타임아웃 설정
        proxy_read_timeout 900;
        proxy_connect_timeout 60;
        proxy_send_timeout 900;
        
        # 버퍼링 설정
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # 헬스체크 엔드포인트
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # 루트 경로
    location / {
        return 200 "Docker Registry is running via Cloudflare\n";
        add_header Content-Type text/plain;
    }
}

log_format	registry	'$remote_addr - $remote_user [$time_local] "$request" '
											'$status $body_bytes_sent "$http_referer" '
											'$http_user_agent" "$http_x_forwarded_for"';

access_log  /var/log/nginx/access.log  registry;