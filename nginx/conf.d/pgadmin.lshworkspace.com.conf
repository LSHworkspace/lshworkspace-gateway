upstream docker-pgadmin {
  server 172.0.0.1:5050;
  # server pgadmin:5050 max_fails=3 fail_timeout=2s;
  # keepalive_timeout 300s;
  # keepalive 20;
}

server {
  listen 80;
  listen [::]:80;

  server_name pgadmin.lshworkspace.com;

  sendfile on;
  keepalive_timeout 65;

  # include /etc/nginx/snippets/global-error-pages.conf;

  location / {
    proxy_pass http://docker-pgadmin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

log_format	pgadmin	'$remote_addr - $remote_user [$time_local] "$request" '
											'$status $body_bytes_sent "$http_referer" '
											'$http_user_agent" "$http_x_forwarded_for"';

access_log  /var/log/nginx/access.log  pgadmin;