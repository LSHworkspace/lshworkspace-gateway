server {
  listen 80;
  listen [::]:80;

  server_name junartstory.com www.junartstory.com;

  sendfile on;
  keepalive_timeout 65;

  # 점검처리
  proxy_intercept_errors on; # 백엔드 요청 가로채기
  error_page 500 502 503 504 =503 /maintenance.html;

  location / {


    root /usr/share/nginx/junartstory;

    index index.html index.htm;
    try_files $uri $uri/ /index.html;


    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /maintenance.html {

    root /usr/share/nginx/html;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header 'Access-Control-Allow-Origin' 'http://static.lshworkspace.com https://static.lshworkspace.com http://maintenancepage.lshworkspace.com https://maintenancepage.lshworkspace.com';
    add_header 'Access-Control-Allow-Methods' 'GET, POST';

    add_header Retry-After 3600 always;
    internal;
  }



  location /robots.txt {
    return 200 "User-agent: *\nDisallow: /";
  }
}

log_format	junartstory	'$remote_addr - $remote_user [$time_local] "$request" '
											'$status $body_bytes_sent "$http_referer" '
											'$http_user_agent" "$http_x_forwarded_for"';

access_log  /var/log/nginx/access.log  junartstory;