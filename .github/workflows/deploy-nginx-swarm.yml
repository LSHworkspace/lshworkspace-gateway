name: Build and Deploy Nginx to DockerHub & Swarm

on:
  push:
    branches: ['release']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: ${{ vars.NGINX_IMAGE_NAME }}

  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_IP: ${{ secrets.SERVER_IP }}
  SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

  SERVICE_NAME: ${{ vars.NGINX_SERVICE_NAME }}
  CONTAINER_HTTP_PORT: ${{ vars.NGINX_HTTP_PORT }}
  CONTAINER_HTTPS_PORT: ${{ vars.NGINX_HTTPS_PORT }}
  REPLICAS: ${{ vars.NGINX_REPLICAS }}
  NETWORK_NAME: ${{ vars.NGINX_NETWORK_NAME }}

  STATIC_TARGET_PATH: /usr/share/nginx
  LOG_TARGET_PATH: /var/log/nginx
  EXTERNAL_CONF_MOUNT: /etc/nginx/nginx.external.conf

  STATIC_SOURCE_PATH: ${{ vars.NGINX_STATIC_SOURCE_PATH }}
  LOG_SOURCE_PATH: ${{ vars.NGINX_LOG_SOURCE_PATH }}
  EXTERNAL_CONF_PATH: ${{ vars.NGINX_EXTERNAL_CONF_PATH }}

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) QEMU 에뮬레이터 등록
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # 2) Buildx 빌더 생성
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set full image name
        run: |
          echo "FULL_IMAGE=${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ endsWith(github.ref, 'release') }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64/v8
          tags: ${{ env.FULL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-swarm:
    runs-on: ubuntu-latest
    needs: build-and-publish-image

    steps:
      - name: Set full image name
        run: |
          echo "FULL_IMAGE=${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Deploy to Docker Swarm via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          envs: FULL_IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,SERVICE_NAME,EXTERNAL_CONF_PATH,STATIC_SOURCE_PATH,LOG_SOURCE_PATH,STATIC_TARGET_PATH,LOG_TARGET_PATH,EXTERNAL_CONF_MOUNT,CONTAINER_HTTP_PORT,CONTAINER_HTTPS_PORT,REPLICAS,NETWORK_NAME
          script: |
            set -e
          
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          
            if ! docker info | grep -q 'Swarm: active'; then
              docker swarm init || true
            fi
          
            if ! docker network ls | grep -q "$NETWORK_NAME"; then
              docker network create --driver overlay --attachable $NETWORK_NAME
            fi
          
            if docker service ls --filter name=$SERVICE_NAME | grep -q $SERVICE_NAME; then
              echo "Updating existing service..."
              docker service update --image $FULL_IMAGE \
                --mount-add type=bind,source=$EXTERNAL_CONF_PATH,target=$EXTERNAL_CONF_MOUNT,readonly \
                --mount-add type=bind,source=$STATIC_SOURCE_PATH,target=$STATIC_TARGET_PATH,readonly \
                --mount-add type=bind,source=$LOG_SOURCE_PATH,target=$LOG_TARGET_PATH \
                --force $SERVICE_NAME
            else
              echo "Creating new service..."
              docker service create --name $SERVICE_NAME \
                --replicas $REPLICAS \
                --network $NETWORK_NAME \
                -p $CONTAINER_HTTP_PORT:$CONTAINER_HTTP_PORT \
                -p $CONTAINER_HTTPS_PORT:$CONTAINER_HTTPS_PORT \
                --mount type=bind,source=$EXTERNAL_CONF_PATH,target=$EXTERNAL_CONF_MOUNT,readonly \
                --mount type=bind,source=$STATIC_SOURCE_PATH,target=$STATIC_TARGET_PATH,readonly \
                --mount type=bind,source=$LOG_SOURCE_PATH,target=$LOG_TARGET_PATH \
                $FULL_IMAGE
            fi
          
            # ✅ 상태 체크
            echo "⏳ Waiting for service status..."
            sleep 5
            STATUS=$(docker service ps --no-trunc --filter "desired-state=running" --format "{{.Error}}" $SERVICE_NAME | head -n 1)
          
            if [[ "$STATUS" == *"no suitable node"* ]] || [[ "$STATUS" == *"rejected"* ]] || [[ "$STATUS" == *"platform"* ]]; then
              echo "❌ Service failed to deploy: $STATUS"
              docker service rm $SERVICE_NAME || true
              exit 1
            fi
          
            docker logout
